<!DOCTYPE html>
<html>
    <head>
        <title>Selector</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <p>Paragraph - Type</p>
        <p class="color-red"> Paragraph - Class</p>
        <p id="Para-id" class="color-red"> Paragraph - ID</p>
        <p id="Para-id" class="color-red" style="color:yellow"> Paragraph - Inline</p>
    </body>
</html>




<!-- priority list of selectors:
1. Inline styles (style attribute)
2. ID selectors (#id)
3. Class selectors (.class)
4. Type selectors (element names) -->
