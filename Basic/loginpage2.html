<!DOCTYPE html>
<html>
    <head>
        <title>Login Page</title>
    </head>
    <body>
        <form>
            <div>
            <label for="username"> Username </label> <br />
            <input 
                type="email"
                id="username"
                placeholder="Enter email here..."
                required
                />
        </div>
            <div>
                <label for="pass" > Password </label> <br />
                <input 
                    type="password"
                    id="pass"
                    placeholder="Enter password here..."
                    required
                    /> <br />
            </div>
            <div>
                <input type="submit" value="Submit"/> <br />
            </div>
        </form>
    </body>
</html>
